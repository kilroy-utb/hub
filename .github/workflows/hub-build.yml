name: Rebuild hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run hub build (local mode, no push)
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          python3 .hermes/skills/hub/scripts/hub.py build \
            --no-push \
            --output ./index.html

      - name: Show what changed
        run: git status --porcelain

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.email "hub-bot@users.noreply.github.com"
            git config user.name "hub-bot"
            git add -A
            git commit -m "hub: auto-regenerate index.html"
            git push
          else
            echo "no changes to commit"
          fi
